<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1950, 마지막 선택 — 기억의 무게</title>
<style>
/* ===== BASE & VARIABLES ===== */
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700&family=Noto+Serif+KR:wght@300;400;600&display=swap');

:root {
  --paper: #e8e0d0;
  --paper-dark: #c8bfaa;
  --ink: #1a1612;
  --ink-light: #3d342a;
  --ink-fade: #6b5d4f;
  --sepia: #8b6f47;
  --sepia-light: #c4a882;
  --red-blood: #8b1a1a;
  --gold-old: #9a7b3a;
  --shadow: rgba(26,22,18,0.6);
  --grain-opacity: 0.04;

  --stat-warmth: #c0392b;
  --stat-safety: #2c5f8a;
  --stat-record: #6b5d4f;
  --stat-duty: #4a6741;

  --transition-slow: 1.2s ease;
  --transition-med: 0.6s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d0b08;
  color: var(--ink);
  font-family: 'Nanum Myeongjo', 'Noto Serif KR', serif;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
}

/* ===== GRAIN OVERLAY ===== */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.4'/%3E%3C/svg%3E");
  opacity: var(--grain-opacity);
  pointer-events: none;
  z-index: 9999;
  animation: grainShift 0.5s steps(2) infinite;
}

@keyframes grainShift {
  0%, 100% { transform: translate(0,0); }
  25% { transform: translate(-1px, 1px); }
  75% { transform: translate(1px, -1px); }
}

/* ===== SCANLINES ===== */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
  z-index: 9998;
}

/* ===== GAME WRAPPER ===== */
#game-wrapper {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== BACKGROUND IMAGE ===== */
#scene-bg {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transition: opacity 1.5s ease, background-image 0s;
  filter: grayscale(85%) sepia(40%) brightness(0.35) contrast(1.1);
  z-index: 0;
}

#scene-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(13,11,8,0.7) 100%);
}

/* ===== TITLE SCREEN ===== */
#title-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0d0b08;
  transition: opacity 1.5s ease;
}

#title-screen .title-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 50%, rgba(139,107,71,0.08) 0%, transparent 70%),
    #0d0b08;
  overflow: hidden;
}

#title-screen .title-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    90deg,
    transparent 0px,
    transparent 40px,
    rgba(139,107,71,0.015) 40px,
    rgba(139,107,71,0.015) 41px
  );
}

.title-year {
  font-family: 'Nanum Myeongjo', serif;
  font-size: clamp(4rem, 12vw, 9rem);
  font-weight: 800;
  color: var(--paper);
  letter-spacing: -0.02em;
  line-height: 1;
  position: relative;
  text-shadow: 0 0 80px rgba(196,168,130,0.15), 2px 4px 0 rgba(0,0,0,0.8);
  animation: titleFlicker 4s ease-in-out infinite;
}

@keyframes titleFlicker {
  0%, 90%, 100% { opacity: 1; }
  92% { opacity: 0.85; }
  94% { opacity: 1; }
  96% { opacity: 0.9; }
}

.title-main {
  font-size: clamp(1.4rem, 4vw, 2.6rem);
  font-weight: 700;
  color: var(--sepia-light);
  letter-spacing: 0.15em;
  margin-top: 0.5rem;
  position: relative;
}

.title-sub {
  font-size: clamp(0.75rem, 2vw, 0.95rem);
  color: var(--ink-fade);
  letter-spacing: 0.3em;
  margin-top: 0.6rem;
  font-family: 'Nanum Gothic', sans-serif;
  font-weight: 400;
}

.title-divider {
  width: 120px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--sepia), transparent);
  margin: 2rem auto;
}

.title-desc {
  max-width: 400px;
  text-align: center;
  color: var(--ink-fade);
  font-size: clamp(0.8rem, 2vw, 0.9rem);
  line-height: 1.9;
  letter-spacing: 0.05em;
  padding: 0 1.5rem;
}

.btn-start {
  margin-top: 2.5rem;
  padding: 0.9rem 2.8rem;
  background: transparent;
  border: 1px solid var(--sepia);
  color: var(--paper);
  font-family: 'Nanum Myeongjo', serif;
  font-size: 1rem;
  letter-spacing: 0.2em;
  cursor: pointer;
  position: relative;
  transition: all 0.3s ease;
  overflow: hidden;
}

.btn-start::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--sepia);
  transform: translateX(-100%);
  transition: transform 0.4s ease;
  z-index: -1;
}

.btn-start:hover::before { transform: translateX(0); }
.btn-start:hover { color: var(--ink); border-color: var(--sepia); }

.static-lines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(139,107,71,0.03) 0px,
    rgba(139,107,71,0.03) 1px,
    transparent 1px,
    transparent 3px
  );
  animation: staticMove 8s linear infinite;
  pointer-events: none;
}

@keyframes staticMove {
  from { background-position: 0 0; }
  to { background-position: 0 100px; }
}

/* ===== AUDIO CONTROL ===== */
#audio-btn {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 200;
  background: rgba(13,11,8,0.8);
  border: 1px solid rgba(139,107,71,0.4);
  color: var(--sepia-light);
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  backdrop-filter: blur(4px);
}
#audio-btn:hover { border-color: var(--sepia); color: var(--paper); }

/* ===== STATS BAR ===== */
#stats-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 50;
  padding: 0.6rem 1.2rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  background: linear-gradient(to bottom, rgba(13,11,8,0.95) 0%, rgba(13,11,8,0) 100%);
  flex-wrap: wrap;
  opacity: 0;
  transition: opacity 0.5s ease;
}

#stats-bar.visible { opacity: 1; }

.stat-item {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 0.7rem;
  color: var(--paper-dark);
}

.stat-icon { font-size: 0.85rem; }

.stat-bar {
  width: 50px;
  height: 3px;
  background: rgba(139,107,71,0.2);
  border-radius: 2px;
  overflow: hidden;
}

.stat-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s ease;
}

.stat-fill.warmth { background: var(--stat-warmth); }
.stat-fill.safety { background: var(--stat-safety); }
.stat-fill.record { background: var(--stat-record); }
.stat-fill.duty { background: var(--stat-duty); }

.stat-val {
  font-size: 0.65rem;
  color: var(--ink-fade);
  min-width: 20px;
}

.stats-sep {
  width: 1px;
  height: 16px;
  background: rgba(139,107,71,0.2);
}

/* ===== SCENE COUNTER ===== */
#scene-counter {
  margin-left: auto;
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 0.65rem;
  color: var(--ink-fade);
  letter-spacing: 0.1em;
}

/* ===== MAIN GAME AREA ===== */
#game-area {
  position: relative;
  z-index: 10;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 5rem 1rem 2rem;
  opacity: 0;
  transition: opacity 0.8s ease;
}

#game-area.visible { opacity: 1; }

/* ===== SCENE CARD ===== */
#scene-card {
  width: 100%;
  max-width: 680px;
  background: rgba(13,11,8,0.88);
  border: 1px solid rgba(139,107,71,0.25);
  border-radius: 2px;
  padding: 2rem 2rem 1.5rem;
  position: relative;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 48px rgba(0,0,0,0.6), inset 0 1px 0 rgba(196,168,130,0.08);
}

#scene-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--sepia), transparent);
  opacity: 0.6;
}

/* ===== LOCATION TAG ===== */
#location-tag {
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 0.65rem;
  color: var(--sepia);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

#location-tag::before, #location-tag::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(139,107,71,0.3));
}
#location-tag::after {
  background: linear-gradient(90deg, rgba(139,107,71,0.3), transparent);
}

/* ===== SCENE TEXT ===== */
#scene-title {
  font-size: clamp(1rem, 3vw, 1.3rem);
  font-weight: 700;
  color: var(--paper);
  line-height: 1.5;
  margin-bottom: 1rem;
  letter-spacing: 0.03em;
}

#scene-text {
  font-size: clamp(0.8rem, 2.2vw, 0.92rem);
  color: var(--paper-dark);
  line-height: 2;
  letter-spacing: 0.04em;
  margin-bottom: 1.4rem;
  min-height: 80px;
}

/* ===== RECORD CARD POPUP ===== */
.record-badge {
  display: inline-block;
  background: rgba(154,123,58,0.15);
  border: 1px solid rgba(154,123,58,0.4);
  color: var(--gold-old);
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  padding: 0.2rem 0.6rem;
  margin-bottom: 0.8rem;
  border-radius: 1px;
}

/* ===== CHOICES ===== */
#choices {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}

.choice-btn {
  background: rgba(232,224,208,0.04);
  border: 1px solid rgba(139,107,71,0.2);
  color: var(--paper-dark);
  padding: 0.8rem 1.2rem;
  text-align: left;
  cursor: pointer;
  font-family: 'Nanum Myeongjo', serif;
  font-size: clamp(0.75rem, 2vw, 0.88rem);
  line-height: 1.7;
  letter-spacing: 0.03em;
  transition: all 0.25s ease;
  position: relative;
  border-radius: 1px;
  overflow: hidden;
}

.choice-btn::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--sepia);
  transform: scaleY(0);
  transition: transform 0.25s ease;
}

.choice-btn:hover {
  background: rgba(139,107,71,0.1);
  border-color: rgba(139,107,71,0.5);
  color: var(--paper);
}

.choice-btn:hover::before { transform: scaleY(1); }

.choice-stat-hint {
  display: block;
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 0.62rem;
  color: var(--ink-fade);
  margin-top: 0.25rem;
  letter-spacing: 0.08em;
}

/* ===== CONTINUE BUTTON ===== */
#continue-btn {
  margin-top: 1rem;
  background: transparent;
  border: 1px solid rgba(139,107,71,0.3);
  color: var(--sepia-light);
  padding: 0.6rem 1.5rem;
  font-family: 'Nanum Myeongjo', serif;
  font-size: 0.82rem;
  cursor: pointer;
  letter-spacing: 0.15em;
  width: 100%;
  transition: all 0.3s ease;
  display: none;
}
#continue-btn:hover { background: rgba(139,107,71,0.1); color: var(--paper); }
#continue-btn.show { display: block; }

/* ===== ENDING SCREEN ===== */
#ending-screen {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(13,11,8,0.97);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.5s ease;
  overflow-y: auto;
  padding: 2rem 1rem;
}

#ending-screen.visible {
  opacity: 1;
  pointer-events: all;
}

.ending-inner {
  max-width: 560px;
  width: 100%;
  text-align: center;
}

.ending-label {
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.4em;
  color: var(--sepia);
  margin-bottom: 1.5rem;
}

.ending-title {
  font-size: clamp(1.6rem, 5vw, 2.8rem);
  font-weight: 800;
  color: var(--paper);
  margin-bottom: 0.8rem;
  line-height: 1.3;
  text-shadow: 0 0 40px rgba(196,168,130,0.1);
}

.ending-divider {
  width: 80px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--sepia), transparent);
  margin: 1.2rem auto;
}

.ending-text {
  color: var(--paper-dark);
  font-size: clamp(0.82rem, 2.5vw, 0.95rem);
  line-height: 2.1;
  letter-spacing: 0.05em;
  margin-bottom: 1.5rem;
}

.ending-reflection {
  background: rgba(139,107,71,0.06);
  border: 1px solid rgba(139,107,71,0.2);
  border-radius: 2px;
  padding: 1.2rem 1.5rem;
  margin-bottom: 1.5rem;
}

.ending-reflection p {
  font-size: 0.82rem;
  color: var(--sepia-light);
  line-height: 1.9;
  letter-spacing: 0.05em;
  font-style: italic;
}

.ending-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.6rem;
  margin-bottom: 1.5rem;
}

.ending-stat-item {
  background: rgba(232,224,208,0.04);
  border: 1px solid rgba(139,107,71,0.15);
  padding: 0.7rem;
  text-align: center;
}

.ending-stat-label {
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 0.65rem;
  color: var(--ink-fade);
  letter-spacing: 0.1em;
  margin-bottom: 0.3rem;
}

.ending-stat-value {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--paper);
}

.btn-restart {
  padding: 0.8rem 2.2rem;
  background: transparent;
  border: 1px solid var(--sepia);
  color: var(--paper);
  font-family: 'Nanum Myeongjo', serif;
  font-size: 0.9rem;
  letter-spacing: 0.2em;
  cursor: pointer;
  transition: all 0.3s ease;
  margin: 0.4rem;
}
.btn-restart:hover { background: rgba(139,107,71,0.15); }

/* ===== RECORDS COLLECTION ===== */
#records-btn {
  position: fixed;
  bottom: 1rem;
  right: 1rem;
  z-index: 200;
  background: rgba(13,11,8,0.85);
  border: 1px solid rgba(154,123,58,0.4);
  color: var(--gold-old);
  padding: 0.45rem 0.9rem;
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(4px);
  display: none;
}
#records-btn:hover { border-color: var(--gold-old); color: var(--paper); }
#records-btn.visible { display: block; }

#records-panel {
  position: fixed;
  bottom: 3.5rem;
  right: 1rem;
  z-index: 200;
  width: min(340px, calc(100vw - 2rem));
  background: rgba(13,11,8,0.97);
  border: 1px solid rgba(154,123,58,0.3);
  padding: 1.2rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
  transform: translateY(8px);
  max-height: 60vh;
  overflow-y: auto;
  backdrop-filter: blur(8px);
}
#records-panel.open { opacity: 1; pointer-events: all; transform: translateY(0); }

.records-title {
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.3em;
  color: var(--gold-old);
  margin-bottom: 0.8rem;
}

.record-card {
  background: rgba(154,123,58,0.06);
  border: 1px solid rgba(154,123,58,0.2);
  padding: 0.7rem 0.9rem;
  margin-bottom: 0.5rem;
  border-radius: 1px;
}

.record-card-title {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--paper);
  margin-bottom: 0.3rem;
}

.record-card-text {
  font-size: 0.68rem;
  color: var(--ink-fade);
  line-height: 1.7;
}

.record-empty {
  font-size: 0.75rem;
  color: var(--ink-fade);
  text-align: center;
  padding: 1rem 0;
  font-style: italic;
}

/* ===== TRANSITION OVERLAY ===== */
#transition-overlay {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: #0d0b08;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}
#transition-overlay.flash { opacity: 1; }

/* ===== STAT CHANGE POPUP ===== */
.stat-popup {
  position: fixed;
  top: 3.5rem;
  right: 1rem;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  pointer-events: none;
}

.stat-change {
  font-family: 'Nanum Gothic', sans-serif;
  font-size: 0.7rem;
  padding: 0.2rem 0.6rem;
  border-radius: 2px;
  animation: statFloat 2s ease forwards;
  white-space: nowrap;
}

.stat-change.up { background: rgba(0,100,0,0.15); color: #7fbf7f; border: 1px solid rgba(0,100,0,0.2); }
.stat-change.down { background: rgba(139,26,26,0.15); color: #bf7f7f; border: 1px solid rgba(139,26,26,0.2); }

@keyframes statFloat {
  0% { opacity: 0; transform: translateY(4px); }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-8px); }
}

/* ===== MEMORIAL QUOTE ===== */
.memorial-quote {
  position: fixed;
  bottom: 1rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-size: 0.65rem;
  color: rgba(139,107,71,0.4);
  font-style: italic;
  letter-spacing: 0.08em;
  white-space: nowrap;
  font-family: 'Nanum Gothic', sans-serif;
  pointer-events: none;
}

/* ===== RADIO NOISE ANIMATION ===== */
@keyframes radioNoise {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 0.3; }
}

.noise-indicator {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--sepia);
  animation: radioNoise 1.5s ease-in-out infinite;
  margin-right: 0.4rem;
  vertical-align: middle;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  #scene-card { padding: 1.4rem 1.2rem 1.2rem; }
  #stats-bar { gap: 0.4rem; }
  .stat-bar { width: 35px; }
  .ending-stats { grid-template-columns: 1fr 1fr; }
}

/* ===== HIDDEN ===== */
.hidden { display: none !important; }

/* ===== TYPEWRITER CURSOR ===== */
.cursor-blink {
  display: inline-block;
  width: 2px;
  height: 0.9em;
  background: var(--sepia-light);
  margin-left: 2px;
  vertical-align: middle;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>

<!-- TRANSITION OVERLAY -->
<div id="transition-overlay"></div>

<!-- STAT POPUP CONTAINER -->
<div class="stat-popup" id="stat-popup-container"></div>

<!-- BACKGROUND -->
<div id="scene-bg"></div>

<!-- AUDIO BUTTON -->
<button id="audio-btn" title="배경음악 ON/OFF" onclick="toggleAudio()">♪</button>

<!-- RECORDS BUTTON -->
<button id="records-btn" onclick="toggleRecords()">📜 기록 카드</button>
<div id="records-panel">
  <div class="records-title">◆ 수집된 기록 카드</div>
  <div id="records-list"></div>
</div>

<!-- AUDIO (GitHub audio 폴더 경로 연결) -->
<audio id="bg-audio" loop>
  <source src="audio/bgm.mp3" type="audio/mpeg">
  <source src="audio/bgm.ogg" type="audio/ogg">
</audio>

<!-- ===================== TITLE SCREEN ===================== -->
<div id="title-screen">
  <div class="title-bg">
    <div class="static-lines"></div>
  </div>
  <div style="position:relative; text-align:center; padding: 0 1.5rem;">

// ── ENGINE ───────────────────────────────────────────────────────────

let typewriterTimeout = null;
let isTyping = false;
let fullText = '';

function startGame() {
  const titleScreen = document.getElementById('title-screen');
  titleScreen.style.opacity = '0';
  setTimeout(() => {
    titleScreen.classList.add('hidden');
    document.getElementById('stats-bar').classList.add('visible');
    document.getElementById('game-area').classList.add('visible');
    document.getElementById('records-btn').classList.add('visible');
    loadScene('intro_01');
    rotateMemorialQuote();
    tryAutoPlayAudio();
  }, 1500);
}

function tryAutoPlayAudio() {
  const audio = document.getElementById('bg-audio');
  if (audio.src) {
    audio.play().then(() => {
      state.audioOn = true;
      document.getElementById('audio-btn').textContent = '♪';
    }).catch(() => {
      state.audioOn = false;
      document.getElementById('audio-btn').textContent = '♩';
    });
  }
}

function toggleAudio() {
  const audio = document.getElementById('bg-audio');
  const btn = document.getElementById('audio-btn');
  if (state.audioOn) {
    audio.pause();
    state.audioOn = false;
    btn.textContent = '♩';
  } else {
    audio.play().then(() => { state.audioOn = true; btn.textContent = '♪'; }).catch(() => {});
  }
}

function toggleRecords() {
  const panel = document.getElementById('records-panel');
  panel.classList.toggle('open');
  renderRecords();
}

function renderRecords() {
  const list = document.getElementById('records-list');
  if (state.records.length === 0) {
    list.innerHTML = '<div class="record-empty">아직 수집된 기록이 없습니다</div>';
    return;
  }
  list.innerHTML = state.records.map(r => `
    <div class="record-card">
      <div class="record-card-title">${r.title}</div>
      <div class="record-card-text">${r.text}</div>
    </div>
  `).join('');
}

function loadScene(sceneId, instant = false) {
  if (sceneId === 'ENDING') {
    showEnding();
    return;
  }

  const scene = SCENES[sceneId];
  if (!scene) {
    showEnding();
    return;
  }

  state.currentScene = sceneId;
  state.history.push(sceneId);
  state.sceneCount++;

  const doLoad = () => {
    // Background
    const bg = document.getElementById('scene-bg');
    if (scene.bg) {
      bg.style.backgroundImage = `url('${CONFIG.bgImageBase}${scene.bg}')`;
    } else {
      bg.style.backgroundImage = 'none';
    }

    // Location
    document.getElementById('location-tag').textContent = scene.location || '';

    // Record badge
    const badge = document.getElementById('record-badge');
    if (scene.record) {
      badge.classList.remove('hidden');
      if (!state.records.find(r => r.title === scene.record.title)) {
        state.records.push(scene.record);
      }
    } else {
      badge.classList.add('hidden');
    }

    // Title
    document.getElementById('scene-title').textContent = scene.title || '';

    // Text (typewriter)
    startTypewriter(scene.text || '');

    // Choices
    renderChoices(scene.choices || []);

    // Scene counter
    document.getElementById('scene-counter').textContent = `${state.sceneCount} / ∞`;

    // Continue button hidden initially
    document.getElementById('continue-btn').classList.remove('show');
  };

  if (instant) {
    doLoad();
  } else {
    doTransition(doLoad);
  }
}

function doTransition(callback) {
  const overlay = document.getElementById('transition-overlay');
  overlay.classList.add('flash');
  setTimeout(() => {
    callback();
    setTimeout(() => {
      overlay.classList.remove('flash');
    }, 300);
  }, CONFIG.transitionDuration);
}

function startTypewriter(text) {
  fullText = text;
  const el = document.getElementById('scene-text');
  el.textContent = '';
  isTyping = true;

  if (typewriterTimeout) clearTimeout(typewriterTimeout);

  let i = 0;
  function type() {
    if (i < text.length) {
      el.textContent = text.slice(0, i + 1);
      i++;
      typewriterTimeout = setTimeout(type, CONFIG.typewriterSpeed);
    } else {
      isTyping = false;
      el.innerHTML = text.replace(/\n/g, '<br>');
    }
  }
  type();
}

function skipTypewriter() {
  if (isTyping) {
    clearTimeout(typewriterTimeout);
    isTyping = false;
    document.getElementById('scene-text').innerHTML = fullText.replace(/\n/g, '<br>');
  }
}

document.getElementById('scene-text').addEventListener('click', skipTypewriter);

function renderChoices(choices) {
  const container = document.getElementById('choices');
  container.innerHTML = '';
  if (!choices || choices.length === 0) return;

  choices.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `${choice.text}${choice.statHint ? `<span class="choice-stat-hint">${choice.statHint}</span>` : ''}`;
    btn.onclick = () => makeChoice(choice);
    container.appendChild(btn);
  });
}

function makeChoice(choice) {
  // Apply flag
  if (choice.flag) {
    state.flags[choice.flag] = true;
  }

  // Apply stat effects
  const effects = choice.effects || {};
  const changes = [];
  Object.entries(effects).forEach(([stat, delta]) => {
    if (delta === 0) return;
    const oldVal = state.stats[stat];
    state.stats[stat] = Math.max(0, Math.min(100, oldVal + delta));
    const diff = state.stats[stat] - oldVal;
    if (diff !== 0) {
      const statLabels = { warmth: '❤️온기', safety: '🛡️안전', record: '📜기록', duty: '⚖️책임' };
      changes.push({ label: statLabels[stat], delta: diff });
    }
  });

  updateStatsUI();
  showStatChanges(changes);

  // Next scene
  setTimeout(() => {
    loadScene(choice.next || 'ENDING');
  }, 400);
}

function updateStatsUI() {
  Object.entries(state.stats).forEach(([stat, val]) => {
    const bar = document.getElementById(`stat-${stat}-bar`);
    const valEl = document.getElementById(`stat-${stat}-val`);
    if (bar) bar.style.width = val + '%';
    if (valEl) valEl.textContent = val;
  });
}

function showStatChanges(changes) {
  const container = document.getElementById('stat-popup-container');
  changes.forEach(({ label, delta }) => {
    const el = document.createElement('div');
    el.className = `stat-change ${delta > 0 ? 'up' : 'down'}`;
    el.textContent = `${label} ${delta > 0 ? '+' : ''}${delta}`;
    container.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  });
}

function handleContinue() {
  loadScene(state.currentScene); // shouldn't be called, but fallback
}

// ── ENDING ───────────────────────────────────────────────────────────

function showEnding() {
  const stats = state.stats;

  // Determine ending
  let ending = null;

  // Hidden ending first (special condition)
  if (state.records.length >= 4 && stats.record >= 65 && stats.warmth >= 55) {
    ending = ENDINGS.hidden_memorial;
  }

  if (!ending) {
    // Student sacrifice
    if (state.flags.is_student && stats.duty >= 60) {
      ending = ENDINGS.youthful_sacrifice;
    }
  }

  if (!ending) {
    // Find best matching ending by condition score
    const candidates = Object.entries(ENDINGS)
      .filter(([, e]) => !e.hidden && e.condition(state.stats, state.flags))
      .map(([id, e]) => {
        let score = 0;
        if (e.condition(state.stats, state.flags)) score += 10;
        return { id, e, score };
      });

    if (candidates.length > 0) {
      // Pick the best by dominant stat
      const dominantStat = Object.entries(stats).sort((a,b) => b[1]-a[1])[0][0];
      const statEndingMap = {
        warmth: 'keeper',
        safety: 'survivor',
        record: 'chronicler',
        duty: 'sentinel',
      };
      const preferred = statEndingMap[dominantStat];
      ending = ENDINGS[preferred] || candidates[0].e;
    } else {
      ending = ENDINGS.shadow;
    }
  }

  // Render ending
  document.getElementById('ending-title').textContent = ending.title;
  document.getElementById('ending-text').innerHTML = (ending.text || '').replace(/\n/g, '<br>');
  document.getElementById('ending-reflection').innerHTML = `<p>${ending.reflection || ''}</p>`;

  const statsHtml = [
    { icon: '❤️', label: '온기', key: 'warmth' },
    { icon: '🛡️', label: '안전', key: 'safety' },
    { icon: '📜', label: '기록', key: 'record' },
    { icon: '⚖️', label: '책임', key: 'duty' },
  ].map(s => `
    <div class="ending-stat-item">
      <div class="ending-stat-label">${s.icon} ${s.label}</div>
      <div class="ending-stat-value">${state.stats[s.key]}</div>
    </div>
  `).join('');

  document.getElementById('ending-stats').innerHTML = statsHtml + `
    <div class="ending-stat-item" style="grid-column:1/-1">
      <div class="ending-stat-label">📜 수집한 기록 카드</div>
      <div class="ending-stat-value">${state.records.length}장</div>
    </div>
  `;

  const screen = document.getElementById('ending-screen');
  screen.classList.add('visible');
}

function restartGame() {
  state = {
    currentScene: 'intro_01',
    stats: { warmth: 50, safety: 50, record: 50, duty: 50 },
    flags: {},
    records: [],
    sceneCount: 0,
    audioOn: state.audioOn,
    history: [],
  };
  updateStatsUI();
  document.getElementById('ending-screen').classList.remove('visible');
  document.getElementById('records-panel').classList.remove('open');
  loadScene('intro_01', true);
}

function rotateMemorialQuote() {
  const el = document.getElementById('memorial-quote');
  let idx = 0;
  function next() {
    el.style.opacity = '0';
    setTimeout(() => {
      el.textContent = MEMORIAL_QUOTES[idx % MEMORIAL_QUOTES.length];
      el.style.transition = 'opacity 1.5s ease';
      el.style.opacity = '1';
      idx++;
    }, 800);
  }
  next();
  setInterval(next, 8000);
}

// ── INIT ─────────────────────────────────────────────────────────────
updateStatsUI();
</script>
